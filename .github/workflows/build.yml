name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build setup
        shell: pwsh
        run: ./build-release.ps1
      - name: Package CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory out/ds5-bt-haptics -Force | Out-Null
          Copy-Item dist/cli/ds5-bt-haptics.exe out/ds5-bt-haptics/
          Copy-Item "DS5 Bridge starten.cmd", README.md, README.de.md, LICENSE, THIRD_PARTY_NOTICES.md out/
          Compress-Archive -Path out/* -DestinationPath ds5-bt-haptics-cli-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ds5-bt-haptics-win-x64
          path: |
            dist/DS5BtHaptics-Setup.exe
            ds5-bt-haptics-cli-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DS5BtHaptics-Setup.exe ds5-bt-haptics-cli-win-x64.zip --generate-notes --title "${{ github.ref_name }}"
