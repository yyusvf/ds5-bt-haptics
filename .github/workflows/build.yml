name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish DS5BtHaptics -c Release -o out/ds5-bt-haptics
      - name: Self test
        run: out/ds5-bt-haptics/ds5-bt-haptics.exe selftest
      - name: Package
        shell: pwsh
        run: |
          Remove-Item out/ds5-bt-haptics/*.pdb -ErrorAction SilentlyContinue
          Copy-Item "DS5 Bridge starten.cmd", README.md, README.de.md, LICENSE, THIRD_PARTY_NOTICES.md out/
          Compress-Archive -Path out/* -DestinationPath ds5-bt-haptics-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ds5-bt-haptics-win-x64
          path: ds5-bt-haptics-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ds5-bt-haptics-win-x64.zip --generate-notes --title "${{ github.ref_name }}"
